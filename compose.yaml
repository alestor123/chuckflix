services:
  chuckflix:
    build: .
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      DATA_DIR: /app/data
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - chuckflix_data:/app/data
    restart: unless-stopped

volumes:
  chuckflix_data: